name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4
        - uses: docker/setup-qemu-action@v3
        - uses: docker/setup-buildx-action@v3
        - name: Login to DockerHub Registry
          run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        - name: Build and push the tagged and latest Docker images for amd64 and arm64
          run: >-
            docker buildx build . --file Dockerfile --push
            --platform linux/amd64,linux/arm64
            --tag dopplertask/dopplertask:${{ github.ref_name }}
            --tag dopplertask/dopplertask:latest

  # The downloads that install.sh fetches: DopplerTask with its own Java runtime, one per system and processor.
  downloads:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            download: macos-arm64
          - runner: macos-15-intel
            download: macos-x64
          - runner: ubuntu-latest
            download: linux-x64
          - runner: ubuntu-24.04-arm
            download: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'
            cache: gradle
        - run: ./bundle.sh
        - run: tar -czf dopplertask-${{ matrix.download }}.tar.gz -C dist dopplertask
        - name: Attach it to the release
          run: gh release upload "${{ github.ref_name }}" dopplertask-${{ matrix.download }}.tar.gz --clobber
          env:
            GH_TOKEN: ${{ github.token }}
