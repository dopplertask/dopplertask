plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

application {
    applicationDefaultJvmArgs = ['-Djdk.internal.httpclient.disableHostnameVerification=true']
}

bootJar {
    archiveBaseName = 'doppler'
    archiveVersion = '0.14.7'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources {
            exclude '**/static/node_modules/**'
        }
    }
}

ext {
    graalVersion = '25.5.5.0.3'
    // Also what Spring Boot manages, so that all parts of ActiveMQ and of the MongoDB driver are of one version.
    set('activemq.version', '6.4.0')
    set('mongodb.version', '5.14.0')
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-webmvc') {
        // Tomcat rejects Host headers containing an underscore and offers no setting to allow them.
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-jetty'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-activemq'
    implementation 'org.apache.activemq:activemq-broker'
    implementation 'org.apache.activemq:activemq-stomp'
    implementation 'org.apache.activemq:activemq-http'

    implementation 'org.apache.velocity.tools:velocity-tools-generic:3.1'
    implementation 'tools.jackson.dataformat:jackson-dataformat-xml'

    implementation 'com.mysql:mysql-connector-j:26.10.0'
    implementation 'org.postgresql:postgresql'
    implementation 'redis.clients:jedis:8.0.2'
    implementation 'org.mongodb:mongodb-driver-sync'
    implementation 'org.eclipse.angus:angus-mail:2.0.5'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    implementation 'org.seleniumhq.selenium:selenium-java:4.52.0'
    implementation "org.graalvm.polyglot:polyglot:$graalVersion"
    implementation "org.graalvm.polyglot:js-community:$graalVersion"

    implementation 'com.h2database:h2:2.5.252'
    runtimeOnly 'org.jetbrains.kotlin:kotlin-reflect'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.junit.vintage:junit-vintage-engine'
    testImplementation 'com.icegreen:greenmail:2.1.15'
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8:18.6.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
