spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
# Tests keep their broker inside the JVM, so a running DopplerTask on this machine never meets them.
dopplertask.brokerPort=0
spring.activemq.broker-url=vm://localhost?create=false&jms.prefetchPolicy.queuePrefetch=1
