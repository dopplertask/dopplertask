<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DopplerTask</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/workbench-core.css">
<link rel="stylesheet" href="css/flow.css">
<script src="stomp.min.js"></script>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div class="work">
    <main class="stage" id="stage" aria-label="Task diagram">
      <div class="world" id="world">
        <svg class="wires" id="wires" width="1" height="1"></svg>
        <div id="nodes"></div>
      </div>
      <div class="empty-card" id="emptyCard" hidden></div>
    </main>
    <div class="quick" id="quick" aria-label="Frequent steps"></div>
    <header class="title" id="title"></header>
    <section class="history-card" aria-label="Run history"><div class="history" id="historyHost" hidden></div></section>
    <div class="dock">
      <div class="run-pill" id="runPill"></div>
      <div class="player strip" id="stripHost" aria-label="Run"></div>
      <div class="tools" id="tools"></div>
      <div class="zoom" id="zoom"></div>
    </div>
  </div>
  <aside class="side" id="side" aria-label="Step library" hidden></aside>
  <aside class="inspector is-hidden" id="inspector" aria-label="Step"></aside>
</div>
</body>
</html>
