server.port=8090
spring.datasource.url=jdbc:h2:~/dopplerdb;AUTO_SERVER=TRUE
spring.datasource.username=root
spring.datasource.password=
# A run holds a connection for its whole length, and up to 50 run at once, so this leaves room for web requests.
spring.datasource.hikari.maximum-pool-size=60
# VALUE became a reserved word in H2 2, and saved tasks have columns with that name.
spring.datasource.hikari.connection-init-sql=SET NON_KEYWORDS VALUE
spring.jpa.hibernate.ddl-auto=update
# A consumer takes one run at a time, so that a long run does not hold others back that another consumer could start.
spring.activemq.broker-url=tcp://localhost:61616?jms.prefetchPolicy.queuePrefetch=1
spring.jpa.open-in-view=true
spring.jackson.deserialization.fail-on-null-for-primitives=false
dopplertask.keepRunsDays=${DOPPLERTASK_KEEP_RUNS_DAYS:0}
dopplertask.encryptionKey=${DOPPLERTASK_ENCRYPTION_KEY:}
dopplertask.keyFile=${DOPPLERTASK_KEY_FILE:${user.home}/.dopplertask/encryption.key}
dopplertask.personToken=${DOPPLERTASK_PERSON_TOKEN:}
dopplertask.agentToken=${DOPPLERTASK_AGENT_TOKEN:}
dopplertask.sso.issuer=${DOPPLERTASK_SSO_ISSUER:}
dopplertask.sso.clientId=${DOPPLERTASK_SSO_CLIENT_ID:}
dopplertask.sso.clientSecret=${DOPPLERTASK_SSO_CLIENT_SECRET:}
dopplertask.sso.allowedDomains=${DOPPLERTASK_SSO_ALLOWED_DOMAINS:}
dopplertask.sso.redirectUri=${DOPPLERTASK_SSO_REDIRECT_URI:}
